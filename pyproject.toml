
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jsonlint-plus"
version = "0.1.0"
description = "A CLI tool for JSON syntax analysis and repair suggestions"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.18,<5"]
schema = ["jsonschema>=4.18,<5"]

[project.scripts]
jsonlint-plus = "jsonlint_plus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
